name: Go SDK CI

on:
  push:
    branches: [main, develop]
    paths: ['go/**', '.github/workflows/go-ci.yml']
  pull_request:
    paths: ['go/**', '.github/workflows/go-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - run: go vet ./...
      - run: go test -race ./...
