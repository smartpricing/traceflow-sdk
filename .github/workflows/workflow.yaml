name: Release Deploy

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed in js/package.json (e.g. 2.8.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Validate committed release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const expected = process.env.REQUESTED_VERSION || process.env.GITHUB_REF_NAME.replace(/^release\//, '');
          assert.match(expected, /^\d+\.\d+\.\d+$/);
          assert.equal(pkg.version, expected, 'Commit the release version before building');
          assert.equal(lock.version, expected);
          assert.equal(lock.packages[''].version, expected);
          NODE

      - name: Check npm credentials
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NO_TWOFA_NPM_TOKEN }}

      # Kafka is needed only for its declarations; do not build its native addon.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:errors && npm test -- --run
      - run: npm run build
      - name: Verify the npm archive
        run: npm run test:package -- "$RUNNER_TEMP/traceflow-sdk.tgz"

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/traceflow-sdk.tgz" --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NO_TWOFA_NPM_TOKEN }}

      - name: Verify published version and archive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NO_TWOFA_NPM_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const published = JSON.parse(execFileSync('npm', ['view', `${pkg.name}@latest`, '--json'], { encoding: 'utf8' }));
          assert.equal(published.version, pkg.version);
          assert.deepEqual(published.exports, pkg.exports);
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync(`${process.env.RUNNER_TEMP}/traceflow-sdk.tgz`)).digest('base64');
          assert.equal(published.dist.integrity, integrity);
          console.log(`Verified ${pkg.name}@${pkg.version} on npm, including exports and archive integrity.`);
          NODE
