name: Release Deploy

on:
  push:
    branches: [main, "release/**"]
    paths: ["js/package.json"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed in js/package.json (e.g. 2.8.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect and validate release version
        id: version
        working-directory: js
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs

  build-and-deploy:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # npm 11.21 supports private dist-tag reads through trusted publishing.
      - run: npm install --global npm@11.21.0
      - name: Check npm publishing access
        run: npm dist-tag ls @dev.smartpricing/traceflow-sdk --json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NO_TWOFA_NPM_TOKEN }}

      # Kafka is needed only for its declarations; do not build its native addon.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:errors && npm run test:release && npm test -- --run
      - run: npm run build
      - name: Verify the npm archive
        run: npm run test:package -- "$RUNNER_TEMP/traceflow-sdk.tgz"

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/traceflow-sdk.tgz" --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NO_TWOFA_NPM_TOKEN }}

      - name: Verify published latest version
        # OIDC supports dist-tag, but npm view needs a separate read token for private packages.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NO_TWOFA_NPM_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tags = JSON.parse(execFileSync('npm', ['dist-tag', 'ls', pkg.name, '--json'], { encoding: 'utf8' }));
          assert.equal(tags.latest, pkg.version);
          const message = `Published ${pkg.name}@${pkg.version}; npm latest verified. The published archive passed export, CJS/ESM import, and frontend bundle checks.`;
          console.log(message);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n');
          NODE
